worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/javascript
        text/xml;


    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Docker's embedded DNS server. Using a resolver + variables in proxy_pass
    # forces nginx to re-resolve upstream hostnames at request time instead of
    # caching the IP once at startup. Without this, recreating a backend
    # container (new IP) makes the gateway return 502 until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;


    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    server {
        listen 8080;
        server_name _;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /docs {
            root /usr/share/nginx/html;
            try_files /docs/index.html =404;
        }

        location = /openapi/auth.json {
            set $auth_upstream auth;
            proxy_pass http://$auth_upstream:8000/openapi.json;
        }
        location = /openapi/notifications.json {
            set $notifications_upstream notifications;
            proxy_pass http://$notifications_upstream:8001/openapi.json;
        }
        location = /openapi/movie.json {
            set $movie_upstream movie;
            proxy_pass http://$movie_upstream:8002/openapi.json;
        }
        location = /openapi/users.json {
            set $users_upstream users;
            proxy_pass http://$users_upstream:8003/openapi.json;
        }
        location = /openapi/reviews.json {
            set $reviews_upstream reviews;
            proxy_pass http://$reviews_upstream:8005/openapi.json;
        }
        location = /openapi/recommendations.json {
            set $recommendations_upstream recomendations;
            proxy_pass http://$recommendations_upstream:8006/openapi.json;
        }

        location /api/v1/auth {
            limit_req zone=api_limit burst=20 nodelay;
            set $auth_upstream auth;
            proxy_pass http://$auth_upstream:8000$request_uri;
        }

        location /api/v1/recommendations {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_read_timeout 300s;
            proxy_pass http://recomendations:8006;
        }

        location /api/v1/admin/users {
            limit_req zone=api_limit burst=20 nodelay;
            set $auth_upstream auth;
            proxy_pass http://$auth_upstream:8000$request_uri;
        }

        location /api/v1/notification {
            limit_req zone=api_limit burst=20 nodelay;
            set $notifications_upstream notifications;
            proxy_pass http://$notifications_upstream:8001$request_uri;
        }

        location /api/v1/users {
            limit_req zone=api_limit burst=20 nodelay;
            set $users_upstream users;
            proxy_pass http://$users_upstream:8003$request_uri;
        }


        location ~ ^/api/v1/(admin/)?(movies|persons|genres|studios|countries|professions)(/|$) {
            limit_req zone=api_limit burst=20 nodelay;
            set $movie_upstream movie;
            proxy_pass http://$movie_upstream:8002$request_uri;
        }

        location ~ ^/api/v1/(admin/)?reviews(/|$) {
            limit_req zone=api_limit burst=20 nodelay;
            set $reviews_upstream reviews;
            proxy_pass http://$reviews_upstream:8005$request_uri;
        }

        location /admin {
            set $admin_upstream admin;
            proxy_pass http://$admin_upstream:8004$request_uri;
        }

        location / {
            set $frontend_upstream frontend;
            proxy_pass http://$frontend_upstream:3000$request_uri;
        }
    }
}
